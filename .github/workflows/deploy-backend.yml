name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for Workload Identity Federation

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  REGION: ${{ vars.GCP_REGION }}
  SERVICE: portfolio-chatbot
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/portfolio/chatbot:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Build and push image
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" backend
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        # Only the image changes; env vars, secrets and scaling stay as defined in Terraform
        run: gcloud run services update "$SERVICE" --region "$REGION" --image "$IMAGE" --quiet

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$URL/health"
