<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Portfolio - Test</title>
    <link rel="stylesheet" href="neural-test.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>Technical Skills</h1>
            <p class="subtitle">Interactive Neural Network - Explore my tech stack and expertise</p>
            <button class="reset-btn" id="resetBtn">Reset View</button>
        </header>

        <!-- Neural Network Canvas -->
        <div class="network-container">
            <canvas id="networkCanvas"></canvas>
            
            <!-- Node Labels (positioned with JS) -->
            <div class="nodes-overlay" id="nodesOverlay"></div>
        </div>

        <!-- Content Panel (appears when clicking a node) -->
        <div class="content-overlay" id="contentOverlay">
            <div class="content-bubble" id="contentBubble">
                <button class="close-btn" id="closeBtn">&times;</button>
                <div class="bubble-content" id="bubbleContent">
                    <!-- Content loaded dynamically -->
                </div>
            </div>
        </div>

        <!-- Instructions -->
        <div class="instructions">
            <p>💡 Cliquez sur une compétence pour voir les détails</p>
            <p>🔗 Les connexions montrent les relations entre technologies</p>
        </div>
    </div>

    <script src="neural-test-new.js"></script>
</body>
</html>
